name: Deploy

on:
  push:
    branches: [main]
  # A release of the product changes the download page, the command reference, the benchmark
  # figures and the release stream. The site follows it rather than waiting for someone to notice.
  repository_dispatch:
    types: [chimera-release]
  schedule:
    # A nightly net, so a missed dispatch costs a day rather than staying missed.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check out chimera-agent
        uses: actions/checkout@v4
        with:
          repository: brcampidelli/chimera-agent
          ref: ${{ vars.CHIMERA_REF || 'main' }}
          path: .content/chimera

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gates CI runs. A deploy that skips them is a deploy that publishes the thing the
      # gates exist to stop.
      - run: npm run verify:tokens
      - run: npm run verify:i18n
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # verify:truth reads the built HTML, so it runs after the build, and it blocks.
      - run: npm run verify:truth

      - name: Ship it
        env:
          KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          # Not `USER`: the runner already defines that, and a secret that silently loses to an
          # environment default is a deploy that lands in somebody else's home directory.
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          SHA: ${{ github.sha }}
        run: |
          # `tr -d '\r'` is not defensive programming, it is the fix for a failure this deploy
          # actually had: copying a multi-line key out of a Windows editor puts CRLF on the
          # clipboard, so the stored secret has a carriage return at the end of every line and
          # OpenSSH rejects it with `Load key "key": error in libcrypto` — an error that says
          # nothing about newlines and sends you looking at the network instead.
          install -m 600 /dev/null key
          printf '%s\n' "$KEY" | tr -d '\r' > key
          # Fail here, with a sentence, rather than three lines later with libcrypto's — and say
          # enough about the SHAPE of the value to tell the failure modes apart. None of this
          # reveals the key: the header and footer are fixed strings, and a count is a count.
          if ! ssh-keygen -y -f key > /dev/null 2>&1; then
            {
              echo "HOSTINGER_SSH_KEY is not a usable private key. What arrived:"
              echo "  lines:            $(wc -l < key)"
              echo "  bytes:            $(wc -c < key)"
              echo "  carriage returns: $(tr -cd '\r' < key | wc -c) (before stripping: see above)"
              echo "  first line is the OPENSSH header: $(head -1 key | grep -qx -- '-----BEGIN OPENSSH PRIVATE KEY-----' && echo yes || echo NO)"
              echo "  last line is the OPENSSH footer:  $(grep -v '^$' key | tail -1 | grep -qx -- '-----END OPENSSH PRIVATE KEY-----' && echo yes || echo NO)"
              echo "  looks like a PUBLIC key instead:  $(head -1 key | grep -q '^ssh-' && echo YES || echo no)"
              echo "  longest body line:                $(sed '1d;$d' key | awk '{ if (length($0) > m) m = length($0) } END { print m+0 }')"
              echo
              echo "A healthy ed25519 key here is 8 lines, 432 bytes, header yes, footer yes, public no."
              # The case this guard was built for, named so the numbers above read as a diagnosis.
              echo "Header NO + footer NO + exactly 70 bytes short = the copy took the body and left"
              echo "the BEGIN/END lines behind. Copy the whole file instead of selecting it:"
              echo "  Get-Content -Raw \$HOME\\.chimera-site-deploy-key\\id_ed25519 | Set-Clipboard"
              echo "ssh-keygen's own words:"
              ssh-keygen -y -f key 2>&1 | sed 's/^/  /'
            } >&2
            exit 1
          fi
          # `ConnectTimeout` because the failure this deploy actually has is a connection that never
          # completes: without it the runner sits for over two minutes before admitting it, and a
          # retry that costs two minutes per attempt is a retry nobody can afford to do three times.
          # The keepalive covers the other shape — a session that opens and then goes quiet mid-rsync.
          # ONE TCP connection for the whole deploy, shared by every command below and by rsync.
          #
          # This step opened five separate sessions — mkdir, readlink, rsync, ln, prune — and each
          # retry multiplied that. It is now one, which is faster and is strictly less of whatever
          # the host is counting when it refuses.
          #
          # **It is not known to be the fix**, and the temptation to say so is why this comment is
          # long. Two "Ship it" failures in the last thirty runs, and they do not tell one story:
          #
          #   * 2026-08-22 02:25 — the previous deploy had finished ninety-four seconds earlier
          #     after five sessions in sixteen seconds, and this one could not `mkdir`, three times
          #     over two minutes. Consistent with a per-source cooldown.
          #   * 2026-08-19 20:08 — no deploy in the preceding two hours, and the run queued behind
          #     it succeeded four minutes later. A cooldown predicts the opposite of both halves.
          #
          # So: one datum for a rate limit and one against it. The host answers 5/5 in ~115ms from a
          # home connection, and hPanel exposes no allowlist to tune, so there is nothing here to
          # verify against. Fewer connections is a change worth making on its own terms; if a
          # "Ship it" failure shows up again after this, the cause is still open.
          ctl="$(mktemp -d)/cm"
          # `BatchMode=yes` for the same reason as the diagnostic below: a deploy must fail on a
          # rejected key, not wait on a password prompt that nobody is there to answer.
          ssh_opts="-i key -p 65002 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o ControlMaster=auto -o ControlPath=$ctl -o ControlPersist=180"
          remote="$SSH_USER@$HOST"
          root="domains/chimeraagent.space"
          rel="chimera-site/releases"

          # This host refuses connections from GitHub runners intermittently: four of the ten deploys
          # before this landed died on `connect to host …: Connection timed out`, and re-running by
          # hand fixed every one of them without changing a byte. That was survivable while a person
          # was watching — from the release that turned on the automatic notice, nobody is.
          #
          # Every step below is idempotent, which is what makes retrying safe rather than clever:
          # mkdir -p, a read, an rsync that resumes, and `ln -sfn` which is the same symlink either
          # way. Three attempts, 20s and 40s apart; a fourth failure is not a flaky network.
          retry() {
            what=$1; shift
            for attempt in 1 2 3; do
              if "$@"; then
                [ "$attempt" -gt 1 ] && echo "$what: succeeded on attempt $attempt"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::$what failed (attempt $attempt/3) — retrying in $((attempt * 20))s"
                sleep $((attempt * 20))
              fi
            done
            diagnose "$what"
            echo "::error::$what failed three times. This host times out on runners; if the site is"
            echo "still on the previous release, re-running this workflow is the whole fix."
            return 1
          }

          # What the log said after every failure so far was `Connection timed out`, and that one
          # sentence covers two problems with different owners: a port that never answered, and a
          # port that answered while the SSH exchange did not finish. Nothing here could tell them
          # apart, so every post-mortem ended at "the host is flaky" — including one where the
          # actual cause was a second deploy nobody needed to have started.
          #
          # Run ONLY after the third failure. `-vvv` on every call would bury a working deploy under
          # two hundred lines of key exchange, which is how a diagnostic gets removed.
          diagnose() {
            echo "::group::ssh diagnostics after \"$1\" failed three times"

            # TCP on its own, first. This is the whole distinction: if the port does not answer, the
            # SSH client's verbosity has nothing to say, and the question is a network or firewall
            # one. If it does answer, the failure is in the exchange and the lines below have it.
            if timeout 20 bash -c "cat < /dev/null > /dev/tcp/$HOST/65002" 2>/dev/null; then
              echo "tcp/65002: answered"
            else
              echo "tcp/65002: no answer within 20s"
            fi

            # A FRESH connection, deliberately not the shared one. Every command in this step reuses
            # one master now, so if the master is what died, reusing it would report the symptom and
            # hide the cause.
            #
            # `-vvv` names the private key's PATH and the host key's fingerprint. It does not print
            # the key, and the host and username are secrets, which the runner masks in this log.
            # `BatchMode=yes` is not tidiness. Without it, an auth failure asks for a password, and
            # whether that hangs depends on there being no TTY — an assumption about the runner that
            # this file would be silently relying on. Tested by running this function locally, where
            # there IS a TTY: it hung until it was killed, which in CI would turn a three-minute
            # failure into the job's twenty-five-minute timeout. A diagnostic that can do that is
            # worse than no diagnostic.
            ssh -vvv -i key -p 65002                 -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o BatchMode=yes                 -o ControlMaster=no -o ControlPath=none                 "$remote" true 2>&1 | tail -40 || true

            echo "::endgroup::"
          }

          # Land the new tree beside the old one, then move the symlink. The document root IS the
          # symlink — verified against this host before the workflow was written — so the site is
          # one directory until the instant it is the other, and is never half-written.
          make_dir() { ssh $ssh_opts "$remote" "mkdir -p ~/$rel/$SHA"; }
          retry "create the release directory" make_dir

          # --link-dest hardlinks whatever the previous release already has, so a deploy that
          # changes six pages transfers six pages rather than eighty megabytes.
          read_live() { ssh $ssh_opts "$remote" "readlink -f ~/$root/public_html 2>/dev/null || true" > prev.txt; }
          retry "read the live release" read_live
          prev=$(cat prev.txt)
          link_dest=""
          if [ -n "$prev" ] && [ "$prev" != "$(printf '/home/%s/%s/%s' "$SSH_USER" "$rel" "$SHA")" ]; then
            link_dest="--link-dest=$prev"
          fi

          # A partial transfer is not a live site: the symlink still points at the old release until
          # the step after this one, so an interrupted rsync costs a retry and nothing else.
          send_files() { rsync -az --delete --timeout=60 $link_dest -e "ssh $ssh_opts" out/ "$remote:$rel/$SHA/"; }
          retry "send the built site" send_files

          swap() { ssh $ssh_opts "$remote" "ln -sfn ~/$rel/$SHA ~/$root/public_html"; }
          retry "point the site at the new release" swap

          # Keep five. A rollback is `ln -sfn` at one of them, which is why they are kept at all.
          # NOT retried, and not fatal: the site is already live at this point, and failing the job
          # over unswept directories would report a successful deploy as a broken one.
          prune() { ssh $ssh_opts "$remote" "cd ~/$rel && ls -1t | tail -n +6 | xargs -r rm -rf"; }
          prune || echo "::warning::could not prune old releases — the deploy itself is live"

          # Close the shared connection rather than leaving ControlPersist to time it out. The
          # runner is thrown away either way; what this buys is that the host sees the session end
          # when the deploy ends, which is the truthful thing for whatever is counting.
          ssh $ssh_opts -O exit "$remote" 2>/dev/null || true

      - name: Prove it is live
        env:
          IP: ${{ secrets.HOSTINGER_SSH_HOST }}
        run: |
          # Against the server itself, by --resolve, not by DNS. A smoke test that resolves the
          # domain would pass by reaching whatever the domain currently points at, which during a
          # DNS change is precisely not the thing being tested.
          #
          # The unprefixed paths are here because the first version of this list was not: it checked
          # /en/docs/ and /pt/, both of which worked, while /docs — the address a person types —
          # 404'd for a day. Checking only the form the site links to tests the site's own links.
          for path in / /docs /cli /blog /skills /download /en/docs/ /pt/ /skills-index.json /sitemap.xml; do
            code=$(curl -s -o /dev/null -L -w '%{http_code}' \
              --resolve "chimeraagent.space:443:$IP" \
              --resolve "chimeraagent.space:80:$IP" \
              "http://chimeraagent.space$path" || echo 000)
            echo "$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
