# Serving a trailing-slash static export.
#
# Next writes `<route>/index.html` for every page, so the only routing rule needed is "try the
# directory". Everything else here is caching and the two headers worth setting on a site that
# loads nothing from anywhere else.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Pre-compressed files are produced by the deploy, so nginx never spends CPU on gzip.
    gzip_static on;

    charset utf-8;
    charset_types text/plain text/css application/javascript application/json application/xml;

    # `/docs/usage/` → `/docs/usage/index.html`. The 404 is a real page, in English.
    location / {
        try_files $uri $uri/ $uri/index.html /404/index.html;
    }

    # Hashed build output. The name changes when the bytes change, so it can be cached forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML must not be cached hard, or a deploy takes a day to become visible.
    location ~* \.html$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # The search index is content-addressed by Pagefind and safe to keep.
    location /_pagefind/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # A static site that never loads a third-party script can say so, and a CSP that says so is a
    # CSP that actually restricts something. `unsafe-inline` covers exactly one script: the theme
    # resolver in <head>, which has to run before the first paint.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /404/index.html;

    access_log off;
}
